
name: Compilar VERITY

on:
  push:
    branches:
      - main
      - principal
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Preparar proyecto
        run: |
          unzip -q VerityAndroid_movil_build.zip -d proyecto
          GRADLEW=$(find proyecto -name gradlew -type f | head -n 1)
          if [ -z "$GRADLEW" ]; then
            echo "No se encontró gradlew"
            exit 1
          fi
          chmod +x "$GRADLEW"
          echo "GRADLEW=$GRADLEW" >> "$GITHUB_ENV"

      - name: Compilar APK
        run: |
          cd "$(dirname "$GRADLEW")"
          ./gradlew assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: VERITY-APK
          path: proyecto/**/build/outputs/apk/debug/*.apk
